<!-- creating random images using xml svg -->
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random SVG Images</title>
</head>
<body>
    <svg height="200" width="200" viewport="0 0 200 200">
        <circle r="50" cx="100" cy="90" fill ="green">
    </svg>
    <svg width="200" height="200">
        <rect x="10" y="10" width="180" height="180" fill="lightblue" />
        <circle cx="100" cy="100" r="50" fill="orange" />
        <line x1="10" y1="10" x2="190" y2="190" stroke="red" stroke-width="5" />
    </svg>
    <svg width="200" height="200">
        <ellipse cx="100" cy="100" rx="80" ry="40" fill="lightgreen" />
        <polygon points="50,150 150,150 100,50" fill="purple" />
        <text x="50" y="180" font-family="Arial" font-size="20" fill="black">SVG</text>    
    </svg>
    <svg height="200" width="200" viewport="0 0 200 200">
        <circle r="50" cx="100" cy="90" fill ="green"></circle>
        <rect x="90" y="82" width="20" height="20" fill="maroon"></rect>
    </svg>
    <!-- creating a w logo -->
    <svg width="200" height="200">
        <rect x="20" y="30" width="160" height="130" fill="green" />
        <polygon points="50,30 80,30 65,60" fill="white" />
        <polygon points="70,160 130,160 100,90" fill="white" />
        <polygon points="130,30 160,30 145,60" fill="white" />
        <line x1="20" y1="30" x2="70" y2="160" stroke="white" stroke-width="10" />
        <line x1="130" y1="160" x2="180" y2="30" stroke="white" stroke-width="10" />
        <polygon points="130,160 180,160 180,40" fill="white" />
        <polygon points="70,160 20,160 20,40" fill="white" />
        

    </svg>
</body>
</html>
